    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 20px; min-height: 100vh; box-sizing: border-box;

        }

        .gateway-btn:hover { 
            background-color: #005a9e; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }
        .gateway-btn:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
